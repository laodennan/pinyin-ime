name: Build Unsigned IPA

# 草稿状态：常量（rime-ice 锁定 commit、XcodeGen 版本）需在首次试跑时填实，见 PLAN.md 4.4 / 6。
on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  # 与 iOS 端 librime 版本严格对齐（LibrimeKit 0.1.0 内含 librime 1.16.1）。见 PLAN.md 2.2。
  LIBRIME_VERSION: "1.16.1"
  # 已锁定（2026-11-04，rime-ice main 的 HEAD，2026-10-31 的词库更新提交）。
  RIME_ICE_COMMIT: "99662ba01e3affa6a0f009174ca530b887bac3b6"
  XCODEGEN_VERSION: "2.44.1"

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache assembled Rime data (incl. precompiled .bin)
        id: rimedata-cache
        uses: actions/cache@v4
        with:
          path: Keyboard/SharedData
          key: rimedata-${{ env.RIME_ICE_COMMIT }}-librime-${{ env.LIBRIME_VERSION }}

      - name: Fetch rime-ice and assemble SharedData
        if: steps.rimedata-cache.outputs.cache-hit != 'true'
        run: bash scripts/fetch-rime-ice.sh "${RIME_ICE_COMMIT}"

      - name: Precompile schemas with official rime_deployer (macOS)
        if: steps.rimedata-cache.outputs.cache-hit != 'true'
        run: bash scripts/precompile-schemas.sh

      - name: Report Rime data size
        run: |
          echo "== SharedData size =="
          du -sh Keyboard/SharedData || true
          echo "== precompiled bins =="
          ls -la Keyboard/SharedData/build/ || true

      - name: Install XcodeGen (pinned)
        run: |
          curl -fsSL -o /tmp/xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
          echo "/tmp/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project PinyinIME.xcodeproj \
            -scheme PinyinIME \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PinyinIME.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/PinyinIME.xcarchive/Products/Applications" -name '*.app' -type d | head -1)
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry PinyinIME-unsigned.ipa Payload
          ls -la PinyinIME-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PinyinIME-unsigned-ipa
          path: PinyinIME-unsigned.ipa
