name: Build Unsigned IPA

# 草稿状态：常量（rime-ice 锁定 commit、XcodeGen 版本）需在首次试跑时填实，见 PLAN.md 4.4 / 6。
on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  # 与 iOS 端 librime 版本严格对齐（LibrimeKit 0.1.0 内含 librime 1.16.1）。见 PLAN.md 2.2。
  LIBRIME_VERSION: "1.16.1"
  # 已按 1.16.1 Release 资产列表核实（2026-11-04）；脚本内有同值默认值，此处显式声明防漂移。
  LIBRIME_ASSET_RIME: "rime-de4700e-macOS-universal.tar.bz2"
  LIBRIME_ASSET_DEPS: "rime-deps-de4700e-macOS-universal.tar.bz2"
  # 已锁定（2026-11-04，rime-ice main 的 HEAD，2026-10-31 的词库更新提交）。
  RIME_ICE_COMMIT: "99662ba01e3affa6a0f009174ca530b887bac3b6"
  XCODEGEN_VERSION: "2.44.1"

jobs:
  build:
    # macos-15 默认 Xcode 16.x。第 13 号运行的教训：macos-14 的 Xcode 15.4 读不了
    # XcodeGen 2.44 生成的新版工程格式（objectVersion 77），Archive 步直接报
    # "future Xcode project file format"。下面 Select Xcode 16 一步再兜底显式选 16.x。
    runs-on: macos-15
    # 发布 Release 需要 contents 写权限（把 IPA 挂到 Release 供手机直下载，
    # 免去浏览器下载产物再上传的往返——2026-11-04 第 35 号产物浏览器下载多次失败的教训）。
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: Cache assembled Rime data (incl. precompiled .bin)
        id: rimedata-cache
        uses: actions/cache@v4
        with:
          path: Keyboard/SharedData
          # -slim1（2026-11-04，PLAN 9.6）：组装逻辑剔除 tencent 大词库后必须
          # 换 key，否则旧缓存（122 MB 全量数据）命中后 fetch/预编译两步被跳过，
          # 瘦身静默失效。组装逻辑再变时继续递增此后缀。
          key: rimedata-${{ env.RIME_ICE_COMMIT }}-librime-${{ env.LIBRIME_VERSION }}-slim1

      - name: Fetch rime-ice and assemble SharedData
        if: steps.rimedata-cache.outputs.cache-hit != 'true'
        run: bash scripts/fetch-rime-ice.sh "${RIME_ICE_COMMIT}"

      - name: Precompile schemas with official rime_deployer (macOS)
        if: steps.rimedata-cache.outputs.cache-hit != 'true'
        run: bash scripts/precompile-schemas.sh

      - name: Report Rime data size
        run: |
          echo "== SharedData size =="
          du -sh Keyboard/SharedData || true
          echo "== precompiled bins =="
          ls -la Keyboard/SharedData/build/ || true

      - name: Install XcodeGen (pinned)
        run: |
          curl -fsSL -o /tmp/xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
          echo "/tmp/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project PinyinIME.xcodeproj \
            -scheme PinyinIME \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PinyinIME.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/PinyinIME.xcarchive/Products/Applications" -name '*.app' -type d | head -1)
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry PinyinIME-unsigned.ipa Payload
          ls -la PinyinIME-unsigned.ipa

      - name: Verify IPA contents (keyboard extension must carry precompiled Rime data)
        run: |
          set -e
          rm -rf /tmp/ipa-verify && mkdir -p /tmp/ipa-verify
          unzip -q PinyinIME-unsigned.ipa -d /tmp/ipa-verify
          APPEX=$(find /tmp/ipa-verify -name '*.appex' -type d | head -1)
          echo "== appex: $APPEX =="
          test -d "$APPEX/SharedData/build"
          BIN_COUNT=$(find "$APPEX/SharedData/build" -name '*.bin' | wc -l | tr -d ' ')
          echo "precompiled .bin files: $BIN_COUNT"
          test "$BIN_COUNT" -gt 0
          du -sh "$APPEX"
          echo "IPA contents verified."

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PinyinIME-unsigned-ipa
          path: PinyinIME-unsigned.ipa

      - name: Publish IPA to GitHub Release (phone-downloadable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.3.0-test >/dev/null 2>&1; then
            gh release upload v0.3.0-test PinyinIME-unsigned.ipa --clobber
          else
            gh release create v0.3.0-test \
              --title "拼音输入法 v0.3 内测版" \
              --notes "九宫格照苹果原生布局重做（5×4 整宽、音节选项进候选栏、符号页加表情页签）+ 打字卡顿优化（候选有界切片、单次快照、按钮池复用）。未签名 IPA，需自签后安装。" \
              PinyinIME-unsigned.ipa
          fi
