# XcodeGen 工程定义 —— 唯一事实源，CI 中 `xcodegen generate` 后构建。
# 取舍理由见 PLAN.md 4.3。Bundle ID 已定版（2026-11-04）：com.mrzhao.pinyinime。
name: PinyinIME
options:
  bundleIdPrefix: com.mrzhao
  deploymentTarget:
    iOS: "16.0"
packages:
  # 路线 A：librime 1.16.1 预编译 SPM 包（已内嵌 librime-lua）。见 PLAN.md 1.2 / Vendor/README.md。
  LibrimeKit:
    url: https://github.com/zhanggenlove/LibrimeKit
    from: "0.1.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  PinyinIME:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mrzhao.pinyinime
    sources:
      - App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 拼音输入法
        # 显式写入版本号引用：实现轮 1 时生成的 plist 显示 1.0（XcodeGen
        # 缺省模板未跟随 MARKETING_VERSION），双 target 都在此钉死。
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
    dependencies:
      - target: PinyinKeyboard
        embed: true
  PinyinKeyboard:
    type: app-extension
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mrzhao.pinyinime.keyboard
    sources:
      # SharedData 必须从 sources 排除：它由下方 postBuildScripts 显式整目录拷贝进 appex；
      # 若被 sources 逐文件收进资源阶段，会同路径相撞
      # （第 14 号运行的 13 条 "Multiple commands produce ...appex/*.schema.yaml" 即此）。
      - path: Keyboard
        excludes:
          - "SharedData"
          - "SharedData/**"
      # 设置共享桥与主 App 共用同一份实现（实现轮 1 加入）：键盘侧需要读写
      # SettingsKey.defaultLayout 等键。单文件双 target 是 XcodeGen 标准做法，
      # 不改变 target 划分；两边各自编译一份，键名与 suite 探测逻辑不会漂移。
      - App/SettingsBridge.swift
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: 拼音键盘
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrimaryLanguage: zh-Hans
            # 设置同步等增强功能需要完全访问；核心打字（引擎+userdb 在扩展沙盒内）不依赖它。见 PLAN.md 4.2。
            RequestsOpenAccess: true
    dependencies:
      - package: LibrimeKit
        product: LibrimeKit
    # Rime 数据由 CI 在 xcodegen 之前组装到 Keyboard/SharedData（见 workflow）。
    # 教训（第 15 号运行验包）：resources 的文件夹引用没有把目录拷进 appex——
    # 产出的 IPA 里扩展只有二进制、没有词库。改用显式构建后脚本拷贝，并加缺失即失败的守卫，
    # 杜绝再静默打出无数据包。本地不存在该目录时不要在本机 generate。
    postBuildScripts:
      - name: Copy Rime SharedData into extension
        script: |
          set -e
          SRC="${SRCROOT}/Keyboard/SharedData"
          DST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/SharedData"
          if [ ! -d "$SRC/build" ]; then
            echo "error: Rime SharedData missing or not precompiled at $SRC" >&2
            exit 1
          fi
          echo "Copying Rime SharedData: $SRC -> $DST"
          rm -rf "$DST"
          cp -R "$SRC" "$DST"
          du -sh "$DST"
  PinyinIMETests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mrzhao.pinyinime.tests
    sources:
      - Tests
    dependencies:
      - target: PinyinKeyboard
